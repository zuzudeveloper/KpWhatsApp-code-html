<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>KP WhatsApp — AI Agent Code Viewer</title>
<style>
:root{
  --bg:#050505;--panel:#0b0b0b;--panel2:#111;--line:#242424;
  --text:#f4f4f4;--muted:#858585;--accent:#b8ff22;--blue:#4cc9ff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
header{
  height:72px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:#090909ee;border-bottom:1px solid var(--line);backdrop-filter:blur(18px);
}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#b8ff22,#5a9d00);
display:grid;place-items:center;color:#081000;font-weight:1000;box-shadow:0 0 28px #b8ff2228}
.title{min-width:0;flex:1}.title b{display:block;font-size:16px}.title small{color:var(--muted);font-size:11px}
.actions{display:flex;gap:7px;align-items:center}
button{
  border:1px solid #303030;background:#151515;color:#eee;border-radius:11px;
  height:38px;padding:0 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;
  transition:.18s ease
}
button:hover{border-color:#526b22;background:#1b2113}
button:active{transform:scale(.95)}
.primary{background:var(--accent);color:#071000;border-color:var(--accent)}
.search{
  width:min(280px,28vw);height:38px;background:#121212;border:1px solid #292929;
  border-radius:11px;color:#fff;padding:0 12px;outline:none
}
.search:focus{border-color:#526b22;box-shadow:0 0 0 3px #b8ff2210}
.meta{
  height:40px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;
  color:#777;font-size:11px;border-bottom:1px solid #191919;background:#080808
}
.meta span{display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px #b8ff22}
.viewer{flex:1;min-height:0;display:flex;overflow:hidden}
.gutter{
  width:62px;flex:none;background:#080808;border-right:1px solid #1c1c1c;
  overflow:hidden;color:#4d4d4d;text-align:right;font:12px/19px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  user-select:none;padding-top:14px
}
.gutter div{height:19px;padding-right:10px}
.codeWrap{flex:1;overflow:auto;background:#070707}
pre{
  margin:0;padding:14px 24px 40px 18px;min-width:max-content;
  color:#d7d7d7;font:12px/19px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  tab-size:2;white-space:pre;counter-reset:line
}
.line{min-height:19px}
mark{background:#b8ff2240;color:#fff;border-radius:3px;padding:1px 0}
.status{
  position:fixed;right:18px;bottom:18px;background:#151515;border:1px solid #303030;
  border-radius:12px;padding:10px 13px;color:#aaa;font-size:11px;opacity:0;transform:translateY(8px);
  pointer-events:none;transition:.2s;z-index:10
}
.status.show{opacity:1;transform:none}
.empty{padding:40px;color:#666;text-align:center}
@media(max-width:720px){
  header{height:64px;padding:0 10px;gap:9px}
  .logo{width:36px;height:36px}.title b{font-size:14px}.title small{font-size:9px}
  .actions button{font-size:10px;padding:0 8px}.search{width:115px}
  .meta{padding:0 10px;gap:8px;white-space:nowrap;overflow:auto}
  .gutter{width:45px;font-size:10px;line-height:18px}.gutter div{height:18px;padding-right:7px}
  pre{font-size:10px;line-height:18px;padding-left:12px}.line{min-height:18px}
}
</style>
</head>

const source = decodeURIComponent(escape(atob(SOURCE_B64)));
const lines = source.split("\n");
const code = document.getElementById("code");
const gutter = document.getElementById("gutter");
const wrap = document.getElementById("codeWrap");
const search = document.getElementById("search");
const statusBox = document.getElementById("status");

document.getElementById("lineInfo").textContent = lines.length.toLocaleString()+" lines";
document.getElementById("sizeInfo").textContent = (new Blob([source]).size/1024).toFixed(1)+" KB";

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function render(query=""){
  const q=query.trim().toLowerCase();
  let matches=0;
  const frag=document.createDocumentFragment();
  const gf=document.createDocumentFragment();
  lines.forEach((line,i)=>{
    const d=document.createElement("div");
    d.className="line";
    if(q){
      const low=line.toLowerCase(), idx=low.indexOf(q);
      if(idx>=0){
        matches++;
        d.innerHTML=esc(line.slice(0,idx))+"<mark>"+esc(line.slice(idx,idx+q.length))+"</mark>"+esc(line.slice(idx+q.length));
      }else d.textContent=line;
    }else d.textContent=line;
    frag.appendChild(d);
    const n=document.createElement("div");n.textContent=i+1;gf.appendChild(n);
  });
  code.replaceChildren(frag);gutter.replaceChildren(gf);
  document.getElementById("matchInfo").textContent=q?(matches+" matching lines"):"";
}
render();

let timer;
search.addEventListener("input",()=>{
  clearTimeout(timer);
  timer=setTimeout(()=>render(search.value),80);
});
function toast(msg){
  statusBox.textContent=msg;statusBox.classList.add("show");
  clearTimeout(statusBox._t);statusBox._t=setTimeout(()=>statusBox.classList.remove("show"),1600);
}
async function copyCode(){
  try{await navigator.clipboard.writeText(source);toast("Full source copied");}
  catch(e){toast("Copy was blocked by the browser");}
}
function downloadCode(){
  const blob=new Blob([source],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Original index.html downloaded");
}
wrap.addEventListener("scroll",()=>{
  gutter.scrollTop=wrap.scrollTop;
});
</script>
